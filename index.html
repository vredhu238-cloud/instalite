<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>InstaLite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d6249f">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
.hr{display:flex;align-items:center;gap:20px}
.hr button{display:flex;position:relative;color:inherit;padding:0}
.hr svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hr .thm{margin-left:10px}
.hr .bdg{left:16px;top:-5px}
@media(max-width:899px){
  body:not([data-view="home"]) header{display:none}
  nav [data-v="create"],nav [data-v="activity"]{display:none}
  nav [data-v="home"]{order:1}
  nav [data-v="reels"]{order:2}
  nav [data-v="inbox"]{order:3}
  nav [data-v="explore"]{order:4}
  nav [data-v="profile"]{order:5}
  nav div{padding:6px 4px}
  nav .nv{padding:8px 14px}
  nav svg{width:28px;height:28px}
  nav .on svg{stroke-width:2.4}
  nav [data-v="home"].on svg,nav [data-v="profile"].on svg{fill:currentColor}
  nav .bdg{left:34px;top:2px}
}
</style>
</head>
<body>
<header>
  <span class="logo"><i class="lg"></i>InstaLite</span>
  <span class="hr">
    <button data-a="nav" data-v="create" aria-label="New post"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
    <button data-a="nav" data-v="activity" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg></button>
    <button class="thm" data-a="theme" aria-label="Theme" style="font-size:20px;line-height:1">&#127763;</button>
  </span>
</header>
<div id="app"></div>
<aside id="side"></aside>
<nav><div id="nav"></div></nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="dm.js"></script>
<script src="stories.js"></script>
<script src="extras.js"></script>
<script src="more.js"></script>
<script src="reels.js"></script>
<script src="private.js"></script>
<script src="safety.js"></script>
<script src="profile.js"></script>
<script src="app.js"></script>
<script src="accounts.js"></script>
<script src="camera.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
