name: Build Android APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize Bubblewrap Project
      run: |
        bubblewrap init --manifest="https://vredhu238-cloud.github.io/instalite/manifest.json" --directory=./android-app

    - name: Build APK
      run: |
        cd android-app
        bubblewrap build

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: InstaLite-APK
        path: android-app/app-release-signed.apk
